  <!-- ================================================= -->
  <!-- PREMIUM UNDERLINE -->
  <!-- ================================================= -->

  <!-- Soft glow -->

  <line x1="495"
        y1="169"
        x2="785"
        y2="169"
        stroke="#8B5CF6"
        stroke-width="9"
        stroke-linecap="round"
        opacity="0.10"
        filter="url(#smallGlow)"/>


  <!-- Subtle base -->

  <line x1="495"
        y1="169"
        x2="785"
        y2="169"
        stroke="#475569"
        stroke-width="1"
        opacity="0.50"/>


  <!-- Main gradient -->

  <line x1="555"
        y1="169"
        x2="725"
        y2="169"
        stroke="url(#accent)"
        stroke-width="3"
        stroke-linecap="round"/>


  <!-- Center point -->

  <circle cx="640"
          cy="169"
          r="3"
          fill="#DDD6FE"/>

  <circle cx="640"
          cy="169"
          r="8"
          fill="#A855F7"
          opacity="0.13"
          filter="url(#smallGlow)"/>


  <!-- ================================================= -->
  <!-- ROLE -->
  <!-- ================================================= -->

  <text x="640"
        y="202"
        text-anchor="middle"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="22"
        font-weight="500"
        letter-spacing="4"
        fill="#F1F5F9">

    SOFTWARE DEVELOPER

  </text>


  <!-- ================================================= -->
  <!-- SKILLS -->
  <!-- ================================================= -->

  <text x="640"
        y="240"
        text-anchor="middle"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="15"
        font-weight="400"
        letter-spacing="2.5"
        fill="#94A3B8">

    FULL STACK  ·  AI  ·  PROBLEM SOLVING

  </text>


  <!-- ================================================= -->
  <!-- SIDE ACCENTS -->
  <!-- ================================================= -->

  <circle cx="465"
          cy="240"
          r="2"
          fill="#818CF8"
          opacity="0.55"/>

  <circle cx="815"
          cy="240"
          r="2"
          fill="#818CF8"
          opacity="0.55"/>


  <!-- ================================================= -->
  <!-- CORNER DETAILS -->
  <!-- ================================================= -->

  <g stroke="#818CF8"
     stroke-width="1"
     opacity="0.35">

    <path d="M70 55 V45 H80"/>
    <path d="M1210 55 V45 H1200"/>

    <path d="M70 265 V275 H80"/>
    <path d="M1210 265 V275 H1200"/>

  </g>

</svg>
