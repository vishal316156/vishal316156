<svg xmlns="http://www.w3.org/2000/svg"
     width="1280"
     height="320"
     viewBox="0 0 1280 320">

  <defs>

    <!-- ================= BACKGROUND ================= -->

    <linearGradient id="bg"
                    x1="0%" y1="0%"
                    x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="52%" stop-color="#0B1022"/>
      <stop offset="100%" stop-color="#12172D"/>
    </linearGradient>


    <!-- ================= ACCENT ================= -->

    <linearGradient id="accent"
                    x1="0%" y1="0%"
                    x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>


    <!-- ================= TITLE ================= -->

    <linearGradient id="title"
                    x1="0%" y1="0%"
                    x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#C7D2FE"/>
    </linearGradient>


    <!-- ================= GLOW ================= -->

    <filter id="glow">
      <feGaussianBlur stdDeviation="30"/>
    </filter>

    <filter id="smallGlow">
      <feGaussianBlur stdDeviation="7"/>
    </filter>


    <!-- ================= GRID ================= -->

    <pattern id="grid"
             width="40"
             height="40"
             patternUnits="userSpaceOnUse">

      <path d="M40 0H0V40"
            fill="none"
            stroke="#94A3B8"
            stroke-width="0.5"
            opacity="0.065"/>

    </pattern>

  </defs>


  <!-- ================================================= -->
  <!-- BACKGROUND -->
  <!-- ================================================= -->

  <rect width="1280"
        height="320"
        fill="url(#bg)"/>

  <rect width="1280"
        height="320"
        fill="url(#grid)"/>


  <!-- ================================================= -->
  <!-- AMBIENT LIGHT -->
  <!-- ================================================= -->

  <circle cx="150"
          cy="100"
          r="160"
          fill="#6366F1"
          opacity="0.08"
          filter="url(#glow)"/>

  <circle cx="1130"
          cy="220"
          r="170"
          fill="#A855F7"
          opacity="0.08"
          filter="url(#glow)"/>


  <!-- ================================================= -->
  <!-- LEFT 3D GEOMETRY -->
  <!-- ================================================= -->

  <polygon points="
      55,70
      155,35
      235,82
      135,118"
      fill="#6366F1"
      fill-opacity="0.055"
      stroke="#818CF8"
      stroke-opacity="0.35"
      stroke-width="1"/>

  <polygon points="
      135,118
      235,82
      235,150
      135,188"
      fill="#A855F7"
      fill-opacity="0.035"
      stroke="#A5B4FC"
      stroke-opacity="0.22"
      stroke-width="1"/>

  <polygon points="
      55,70
      135,118
      135,188
      55,135"
      fill="#6366F1"
      fill-opacity="0.025"
      stroke="#818CF8"
      stroke-opacity="0.18"
      stroke-width="1"/>


  <!-- Left geometry details -->

  <line x1="75"
        y1="75"
        x2="155"
        y2="110"
        stroke="#A5B4FC"
        stroke-width="1"
        opacity="0.25"/>

  <line x1="155"
        y1="110"
        x2="215"
        y2="84"
        stroke="#A5B4FC"
        stroke-width="1"
        opacity="0.25"/>


  <!-- ================================================= -->
  <!-- LEFT LOWER GEOMETRY -->
  <!-- ================================================= -->

  <polygon points="
      10,235
      90,195
      175,235
      95,278"
      fill="#8B5CF6"
      fill-opacity="0.035"
      stroke="#818CF8"
      stroke-opacity="0.20"
      stroke-width="1"/>

  <polygon points="
      95,278
      175,235
      175,285
      95,320"
      fill="#6366F1"
      fill-opacity="0.025"
      stroke="#818CF8"
      stroke-opacity="0.16"
      stroke-width="1"/>


  <!-- ================================================= -->
  <!-- RIGHT 3D GEOMETRY -->
  <!-- ================================================= -->

  <polygon points="
      1040,80
      1125,35
      1220,75
      1135,122"
      fill="#8B5CF6"
      fill-opacity="0.05"
      stroke="#A5B4FC"
      stroke-opacity="0.32"
      stroke-width="1"/>

  <polygon points="
      1135,122
      1220,75
      1220,145
      1135,193"
      fill="#6366F1"
      fill-opacity="0.035"
      stroke="#818CF8"
      stroke-opacity="0.22"
      stroke-width="1"/>

  <polygon points="
      1040,80
      1135,122
      1135,193
      1040,150"
      fill="#8B5CF6"
      fill-opacity="0.025"
      stroke="#A5B4FC"
      stroke-opacity="0.18"
      stroke-width="1"/>


  <!-- Right geometry details -->

  <line x1="1060"
        y1="82"
        x2="1135"
        y2="115"
        stroke="#C4B5FD"
        stroke-width="1"
        opacity="0.25"/>

  <line x1="1135"
        y1="115"
        x2="1200"
        y2="82"
        stroke="#C4B5FD"
        stroke-width="1"
        opacity="0.25"/>


  <!-- ================================================= -->
  <!-- RIGHT LOWER GEOMETRY -->
  <!-- ================================================= -->

  <polygon points="
      1080,215
      1170,175
      1270,220
      1180,265"
      fill="#6366F1"
      fill-opacity="0.04"
      stroke="#818CF8"
      stroke-opacity="0.22"
      stroke-width="1"/>

  <polygon points="
      1180,265
      1270,220
      1270,278
      1180,320"
      fill="#8B5CF6"
      fill-opacity="0.025"
      stroke="#A5B4FC"
      stroke-opacity="0.16"
      stroke-width="1"/>


  <!-- ================================================= -->
