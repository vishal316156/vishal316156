  <!-- ================================================= -->

  <polygon points="
      285,65
      305,52
      325,65
      305,78"
      fill="#A855F7"
      fill-opacity="0.06"
      stroke="#A5B4FC"
      stroke-opacity="0.25"
      stroke-width="1"/>

  <polygon points="
      955,250
      975,237
      995,250
      975,263"
      fill="#6366F1"
      fill-opacity="0.06"
      stroke="#A5B4FC"
      stroke-opacity="0.25"
      stroke-width="1"/>


  <!-- ================================================= -->
  <!-- PARTICLES -->
  <!-- ================================================= -->

  <g fill="#A5B4FC">

    <circle cx="315" cy="105" r="1.5" opacity="0.45"/>
    <circle cx="350" cy="260" r="1" opacity="0.30"/>
    <circle cx="420" cy="55" r="1" opacity="0.35"/>

    <circle cx="860" cy="70" r="1.2" opacity="0.35"/>
    <circle cx="920" cy="260" r="1" opacity="0.35"/>
    <circle cx="1000" cy="95" r="1.5" opacity="0.40"/>

  </g>


  <!-- ================================================= -->
  <!-- TOP / BOTTOM FRAME -->
  <!-- ================================================= -->

  <line x1="70"
        y1="34"
        x2="1210"
        y2="34"
        stroke="url(#accent)"
        stroke-width="1"
        opacity="0.45"/>

  <line x1="70"
        y1="286"
        x2="1210"
        y2="286"
        stroke="url(#accent)"
        stroke-width="1"
        opacity="0.45"/>


  <!-- ================================================= -->
  <!-- TOP LABEL -->
  <!-- ================================================= -->

  <text x="640"
        y="78"
        text-anchor="middle"
